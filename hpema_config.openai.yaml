# HPEMA — OpenAI API Configuration
# Usage: HPEMA_CONFIG=hpema_config.openai.yaml python -m cli.main
#
# Prerequisites:
#   export OPENAI_API_KEY=sk-...
#
# Notes:
#   - gpt-4o-mini is cheapest and supports json_schema constrained output
#   - gpt-4o gives better code quality, especially for Dafny specs
#   - All three agents can use different models — e.g. actor=gpt-4o, checker=gpt-4o-mini

models:
  actor:
    endpoint: "https://api.openai.com/v1"
    model: "gpt-4o-mini"
    api_key_env: "OPENAI_API_KEY"
  checker:
    endpoint: "https://api.openai.com/v1"
    model: "gpt-4o-mini"
    api_key_env: "OPENAI_API_KEY"
  policy:
    endpoint: "https://api.openai.com/v1"
    model: "gpt-4o-mini"
    api_key_env: "OPENAI_API_KEY"

policies:
  standards_dir: "data/standards"
  default_standard: "DO_178C"
  embedding_model: "all-MiniLM-L6-v2"

verification:
  prover: "dafny"
  timeout_seconds: 120
  binary_path: "dafny"
  solver_path: null

pipeline:
  max_iterations: 3
  require_human_approval: false
  audit_log_dir: "logs/audit"
  stage: "checker"

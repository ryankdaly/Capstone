# HPEMA ARC Configuration — for running on a GPU node via tmux
# Usage: HPEMA_CONFIG=hpema_config.arc.yaml uvicorn backend.main:app --port 8000

models:
  actor:
    endpoint: "https://integrate.api.nvidia.com/v1"
    model: "tiiuae/falcon3-7b-instruct"
    api_key_env: "NVIDIA_API_KEY"
  checker:
    endpoint: "http://localhost:8001/v1"
    model: "Qwen/Qwen2.5-Coder-7B-Instruct"
    api_key_env: "HPEMA_API_KEY"
  policy:
    endpoint: "http://localhost:8001/v1"
    model: "Qwen/Qwen2.5-Coder-7B-Instruct"
    api_key_env: "HPEMA_API_KEY"
  dafny_architect:
    endpoint: "http://localhost:8001/v1"
    model: "Qwen/Qwen2.5-Coder-7B-Instruct"
    api_key_env: "HPEMA_API_KEY"

policies:
  standards_dir: "data/standards"
  default_standard: "DO_178C"
  embedding_model: "all-MiniLM-L6-v2"

verification:
  prover: "dafny"
  timeout_seconds: 120
  binary_path: "/projects/meng/Capstone/dafny/dafny/dafny"

pipeline:
  max_iterations: 3
  require_human_approval: false # disable for initial testing
  audit_log_dir: "logs/audit"
  stage: "checker" # Actor + Dafny verification (no Policy agent yet)
